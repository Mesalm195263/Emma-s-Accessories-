
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الإكسسوارات والساعات</title>
  <style>
    body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; direction: rtl; background-color: #f4f4f4; }
    header, footer { background-color: #222; color: #fff; text-align: center; padding: 10px; }
    .form-container, .products { padding: 20px; max-width: 800px; margin: auto; }
    input, textarea { width: 100%; padding: 10px; margin: 5px 0; }
    .product { background: #fff; padding: 15px; margin-top: 10px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .product img { width: 100%; max-width: 300px; border-radius: 10px; }
    button { background: #28a745; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <header>
    <h1>متجر الإكسسوارات والساعات</h1>
  </header>
  <div class="form-container">
    <h2>أضف منتج جديد</h2>
    <input type="text" id="name" placeholder="اسم المنتج">
    <input type="text" id="price" placeholder="السعر">
    <input type="text" id="img" placeholder="رابط الصورة">
    <textarea id="desc" placeholder="الوصف"></textarea>
    <button onclick="addProduct()">أضف</button>
  </div>
  <div class="products" id="products"></div>
  <footer>جميع الحقوق محفوظة &copy; 2025</footer>
  <script>
    function addProduct() {
      const name = document.getElementById("name").value;
      const price = document.getElementById("price").value;
      const img = document.getElementById("img").value;
      const desc = document.getElementById("desc").value;
      const container = document.getElementById("products");
      const product = document.createElement("div");
      product.className = "product";
      product.innerHTML = `
        <img src="${img}" alt="${name}">
        <h3>${name}</h3>
        <p>${desc}</p>
        <p class="price">${price} جنيه</p>
      `;
      container.appendChild(product);
      document.getElementById("name").value = "";
      document.getElementById("price").value = "";
      document.getElementById("img").value = "";
      document.getElementById("desc").value = "";
    }
  </script>
</body>
</html>
